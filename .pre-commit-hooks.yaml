- id: lipstyk
  name: lipstyk
  description: Check staged source files for machine-generated code patterns
  entry: lipstyk --exclude-tests --threshold 20
  language: rust
  types: [text]

- id: lipstyk-diff
  name: lipstyk (diff only)
  description: Check changed lines in staged source files for machine-generated code patterns
  entry: lipstyk --diff HEAD --exclude-tests --threshold 15
  language: rust
  types: [text]
